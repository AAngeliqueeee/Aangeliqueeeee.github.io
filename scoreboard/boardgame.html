<!DOCTYPE html>
<html>
<head>
    <title>Scrabble Scorecard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Scrabble Tournament</h1>
    <table>
        <thead>
            <tr>
                <th>Player Name</th>
                <th>Round 1</th>
                <th>Round 2</th>
                <th>Round 3</th>
                <th class="total">Final</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Alice</td>
                <td>24</td>
                <td>18</td>
                <td>32</td>
                <td class="total">74</td>
            </tr>
            <tr>
                <td>Bob</td>
                <td>12</td>
                <td>45</td>
                <td>10</td>
                <td class="total">67</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
