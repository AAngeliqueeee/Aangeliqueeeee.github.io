<!DOCTYPE html>
<html>
<head>
    <title>Golf Scorecard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Pro Golf Scorecard</h1>
    <table>
        <thead>
            <tr>
                <th>Player</th>
                <th>Hole 1</th>
                <th>Hole 2</th>
                <th>Hole 3</th>
                <th>Hole 4</th>
                <th class="total">Total</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Tiger Woods</td>
                <td>4</td>
                <td>3</td>
                <td>5</td>
                <td>4</td>
                <td class="total">16</td>
            </tr>
            <tr>
                <td>Rory McIlroy</td>
                <td>3</td>
                <td>4</td>
                <td>4</td>
                <td>4</td>
                <td class="total">15</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
